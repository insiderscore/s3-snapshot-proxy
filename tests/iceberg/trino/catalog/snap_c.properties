connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=snap_c
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://iceberg-postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=s3://iceberg-origin/warehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY
iceberg.metadata-cache.enabled=false
iceberg.object-store-layout.enabled=true
iceberg.register-table-procedure.enabled=true
fs.s3.enabled=true
s3.endpoint=http://s3proxy-iceberg-c:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=origin-access
s3.aws-secret-key=origin-secret
