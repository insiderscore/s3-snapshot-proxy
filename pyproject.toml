[project]
name = "s3-snapshot-proxy"
version = "0.1.0"
description = "S3 snapshot proxy service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "httpx==0.28.1",
  "httpx-auth==0.23.1",
  "boto3==1.43.21",
]

[dependency-groups]
test = [
  "pytest==9.0.3",
  "tqdm==4.67.3",
  "requests==2.34.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
