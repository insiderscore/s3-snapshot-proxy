[project]
name = "s3-snapshot-proxy"
version = "0.1.0"
description = "S3 snapshot proxy service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.3,<0.140.0",
  "uvicorn[standard]>=0.52.4,<0.53.0",
  "httpx>=0.28.1,<0.30.0",
  "httpx-auth>=0.23.1,<0.24.0",
  "boto3>=1.43.21,<2.0.0",
]

[dependency-groups]
test = [
  "pytest>=9.0.3,<10.0.0",
  "tqdm>=4.67.3,<5.0.0",
  "requests>=2.34.2,<3.0.0",
  "trino>=0.337.0,<0.338.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
