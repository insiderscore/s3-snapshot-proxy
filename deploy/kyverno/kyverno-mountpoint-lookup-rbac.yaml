apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s3-snapshot-proxy-kyverno-mountpoint-lookup
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - configmaps
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: s3-snapshot-proxy-kyverno-mountpoint-lookup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s3-snapshot-proxy-kyverno-mountpoint-lookup
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
