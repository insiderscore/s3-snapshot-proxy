apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s3-snapshot-proxy-mountpoint-reader
rules:
  - apiGroups:
      - s3.csi.aws.com
    resources:
      - mountpoints3podattachments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: s3-snapshot-proxy-mountpoint-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s3-snapshot-proxy-mountpoint-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: mount-s3
